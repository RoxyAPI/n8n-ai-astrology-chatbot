name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new release of the RoxyAPI node that renames an operation or field fails here first.
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-save --legacy-peer-deps @roxyapi/n8n-nodes-roxyapi n8n-workflow
      - run: node scripts/check.mjs
